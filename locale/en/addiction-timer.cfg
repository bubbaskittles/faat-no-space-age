[mod-setting-name]
addiction-timer-minutes=Addiction timer (minutes)
faat-warning-minutes=Warning before closing (minutes)
faat-carryover=Carry time over between loads
faat-lockout=Lock the save when time runs out

[mod-setting-description]
addiction-timer-minutes=Time in minutes before the game automatically saves and closes (15-600 minutes)
faat-warning-minutes=How many minutes before closing to show a chat warning with an alert sound. 0 turns the warning off. The last-minute countdown always shows.
faat-carryover=When on, play time is stored in the save, so saving and reloading continues the countdown instead of restarting it. When off, every load starts a fresh timer.
faat-lockout=When on, the save is locked once the timer runs out. Loading a locked save closes the game again after 30 seconds, until you type /faat-unlock to start a new day. Factorio mods can't read the real date, so unlocking is up to you.
